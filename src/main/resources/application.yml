spring:
  application:
    name: dms
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  config:
    import: "optional:file:.env[.properties]"
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    # properties:
    #   hibernate:
    #     SQL: DEBUG
    #     type:
    #       descriptor:
    #         sql:
    #           BasicBinder: TRACE
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  api-docs:
    path: /dms-api-docs
  swagger-ui:
    url: /dms-api-docs

# jwt
jwt:
  base64-secret: ${JWT_SECRET}
  token-validity-in-seconds: ${JWT_VALIDITY}
  refresh-token-validity-in-seconds: ${JWT_REFRESH_VALIDITY}

# cloudinary
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# cloudflare-r2 (S3-compatible API)
r2:
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  region: ${R2_REGION:auto}
  bucket-name: ${R2_BUCKET_NAME}
  endpoint: ${R2_ENDPOINT}

# file
document:
  version:
    max: 5

# google
google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  token-url: https://oauth2.googleapis.com/token

# url
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
dms:
  processor:
    base-url: ${DMS_PROCESSOR_BASE_URL}
    api-key: ${DMS_PROCESSOR_API_KEY}

# stego
stego:
  base64-secret: ${STEGO_SECRET}

# rabbitmq
rabbitmq:
  host: ${RABBITMQ_HOST}
  port: ${RABBITMQ_PORT}
  username: ${RABBITMQ_USERNAME}
  password: ${RABBITMQ_PASSWORD}
  document:
    queue: ${RABBITMQ_DOCUMENT_PROCESS_QUEUE}
    exchange: ${RABBITMQ_DOCUMENT_EXCHANGE}
    routing-key: ${RABBITMQ_DOCUMENT_ROUTING_KEY}
    processing-result:
      queue: ${RABBITMQ_DOCUMENT_RESULT_QUEUE}
